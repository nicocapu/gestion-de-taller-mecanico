<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingreso Mecánicos - Taller Hamed y Hamed</title>
    <link rel="stylesheet" href="inicio.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <style>
        body {
            background-color: #f5f5f5;
            font-family: 'Poppins', sans-serif;
        }

        .login-container {
            max-width: 420px;
            margin: 60px auto;
            background-color: #ffffff;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
            padding: 30px 25px;
        }

        .login-container h2 {
            text-align: center;
            margin-bottom: 5px;
        }

        .login-container p {
            text-align: center;
            font-size: 0.9em;
            color: #666;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 0.9em;
        }

        .form-group input {
            width: 100%;
            padding: 10px 12px;
            border-radius: 6px;
            border: 1px solid #ccc;
            box-sizing: border-box;
            font-size: 0.95em;
        }

        .btn-login {
            width: 100%;
            padding: 10px 0;
            border-radius: 6px;
            border: none;
            background-color: #FFC107;
            color: #2c2c2c;
            font-weight: 600;
            cursor: pointer;
            margin-top: 5px;
        }

        .btn-login:hover:not([disabled]) {
            background-color: #e0a800;
        }

        .error-text {
            color: red;
            font-size: 0.85em;
            margin-top: 10px;
            text-align: center;
        }

        .info-text {
            font-size: 0.85em;
            color: #555;
            margin-top: 10px;
            text-align: center;
        }

        header.main-header nav a.btn-volver {
            padding: 8px 18px;
            border-radius: 20px;
            border: 1px solid #333;
            font-size: 0.85em;
        }
    </style>
</head>

<body>

    <header class="main-header">
        <div class="container">
            <img src="assets/logo-hamed-y-hamed-negro.png" alt="Hamed & Hamed Logo" class="logo-img">
            <nav>
                <a href="inicio.html#servicios">Servicios</a>
                <a href="inicio.html#contacto">Contacto</a>
                <a href="inicio.html" class="btn-volver">Volver al inicio</a>
            </nav>
        </div>
    </header>

    <main>
        <div class="login-container">
            <h2>Ingreso de Mecánicos</h2>
            <p>Ingrese con su correo corporativo y clave asignada.</p>

            <form id="formLogin">
                <div class="form-group">
                    <label for="correo_login">Correo</label>
                    <input type="email" id="correo_login" required placeholder="ej: Jperez@hamed.com">
                </div>

                <div class="form-group">
                    <label for="password_login">Contraseña</label>
                    <input type="password" id="password_login" required
                        placeholder="Clave entregada por el administrador">
                </div>

                <button type="submit" id="btnLogin" class="btn-login">Ingresar</button>
                <p id="mensaje-error-login" class="error-text"></p>
                <p class="info-text">Si olvidó su clave, solicítela al administrador del sistema.</p>
            </form>
        </div>
    </main>

    <script src="login.js"></script>
</body>

</html>
